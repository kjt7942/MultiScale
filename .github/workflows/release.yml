name: build-and-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 단위 테스트
        run: gradle --no-daemon testDebugUnitTest

      - name: 디버그 빌드 (태그가 아닐 때 컴파일 확인용)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: gradle --no-daemon assembleDebug

      - name: 버전 계산
        if: startsWith(github.ref, 'refs/tags/v')
        id: ver
        run: |
          V="${GITHUB_REF_NAME#v}"
          IFS=. read -r MA MI PA <<< "$V"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((MA*10000 + MI*100 + PA))" >> "$GITHUB_OUTPUT"

      - name: 서명 키 준비 (없으면 실패)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KS_B64 KS_PW KA KP; do
            if [ -z "${!v}" ]; then echo "::error::시크릿 누락: $v"; exit 1; fi
          done
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KA" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KP" >> "$GITHUB_ENV"

      - name: 릴리스 APK 빌드
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          gradle --no-daemon assembleRelease
          -PappVersion=${{ steps.ver.outputs.name }}
          -PappVersionCode=${{ steps.ver.outputs.code }}

      - name: APK 이름 정리
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/release/app-release.apk "MultiScale-${{ steps.ver.outputs.name }}.apk"

      - name: GitHub Release 게시
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MultiScale-${{ steps.ver.outputs.name }}.apk
          generate_release_notes: true

      - name: 디버그 APK 보관
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
