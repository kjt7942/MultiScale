name: build-and-release

# main 에 푸시하면 테스트·빌드를 하고, version.txt 의 버전으로 아직 릴리스가 없으면
# 서명된 APK 를 만들어 v<버전> 태그와 함께 Release 로 게시한다.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 단위 테스트
        run: gradle --no-daemon testDebugUnitTest

      - name: 릴리스 필요 여부 확인
        id: ver
        run: |
          V="$(tr -d ' \r\n' < version.txt)"
          IFS=. read -r MA MI PA <<< "$V"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((MA*10000 + MI*100 + PA))" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && ! gh release view "v$V" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 디버그 빌드 (컴파일 확인용)
        if: steps.ver.outputs.release != 'true'
        run: gradle --no-daemon assembleDebug

      - name: 서명 키 준비 (없으면 실패)
        if: steps.ver.outputs.release == 'true'
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KS_B64 KS_PW KA KP; do
            if [ -z "${!v}" ]; then echo "::error::시크릿 누락: $v"; exit 1; fi
          done
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KA" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KP" >> "$GITHUB_ENV"

      - name: 릴리스 APK 빌드
        if: steps.ver.outputs.release == 'true'
        run: >
          gradle --no-daemon assembleRelease
          -PappVersion=${{ steps.ver.outputs.name }}
          -PappVersionCode=${{ steps.ver.outputs.code }}

      - name: APK 이름 정리
        if: steps.ver.outputs.release == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk "MultiScale-${{ steps.ver.outputs.name }}.apk"

      - name: GitHub Release 게시
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: MultiScale-${{ steps.ver.outputs.name }}.apk
          generate_release_notes: true
